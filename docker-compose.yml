version: '3.8'

services:

  database:
    container_name: database
    image: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: apartmentservicedatabase
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql/data
    ports:
      - "3307:5432"
    networks:
      - apartmentNetwork

  apartmentservice:
    image: 'apartmentservice:latest'
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apartmentservice
    restart: on-failure
    env_file:
      - .env
    ports:
      - "4110:4110"
    environment:
      - server.port=4110
      - spring.datasource.username=${DATABASE_USERNAME}
      - spring.datasource.password=${DATABASE_PASSWORD}
      - WORK_PERMISSION_DB_IP=database
      - WORK_PERMISSION_DB_PORT=5432
      - spring.datasource.url=jdbc:postgresql://database:5432/apartmentservicedatabase
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    depends_on:
      - database
      - sonarqube
    networks:
      - apartmentNetwork

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./data/prometheus/config:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - apartmentNetwork

  grafana:
    image: "grafana/grafana-oss:latest"
    pull_policy: always
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=localhost
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED}
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
    networks:
      - apartmentNetwork

  alertmanager:
    build:
      context: ./data/alertmanager
      dockerfile: Dockerfile
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    env_file:
      - .env
    networks:
      - apartmentNetwork

  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - database
    networks:
      - apartmentNetwork

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  apartmentNetwork:
